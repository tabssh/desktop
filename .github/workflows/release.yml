name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run tests
        run: cargo test --workspace --all-features --target x86_64-unknown-linux-musl

      - name: Compile check (amd64)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Compile check (arm64)
        run: cargo build --release --target aarch64-unknown-linux-musl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          ref="${{ github.ref }}"
          if [[ "$ref" != refs/tags/* ]]; then
            echo "::error::release.yml triggered on non-tag ref '$ref'. Releases require a tag push (refs/tags/v...)."
            exit 1
          fi
          tag="${ref#refs/tags/}"
          if printf '%s' "$tag" | grep -qP '[[:space:][:cntrl:]]'; then
            echo "::error::Tag '$tag' contains whitespace or control characters and is not a valid tag name."
            exit 1
          fi
          git tag -d "$tag" 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "Tag '$tag' ensured at $(git rev-parse HEAD)"

      - name: Build release artifacts
        run: |
          mkdir -p dist
          CRATE=$(grep '^name' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
          TAG="${{ github.ref_name }}"

          for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo build --release --target "$TARGET"

            case "$TARGET" in
              x86_64-unknown-linux-musl)  ARTIFACT="${CRATE}-linux-amd64" ;;
              aarch64-unknown-linux-musl) ARTIFACT="${CRATE}-linux-arm64" ;;
            esac

            cp "target/$TARGET/release/$CRATE" "dist/$ARTIFACT"
            sha256sum "dist/$ARTIFACT" > "dist/$ARTIFACT.sha256"

            # musl's ldd on a genuinely static binary reports "Not a valid
            # dynamic program" (not glibc's "not a dynamic executable"
            # wording), so match both phrasings case-insensitively.
            ldd "target/$TARGET/release/$CRATE" 2>&1 \
              | grep -qiE 'not a dynamic executable|not a valid dynamic program|statically linked' \
              || { echo "::error::$TARGET binary has unexpected dynamic deps"; exit 1; }
          done

          cargo cyclonedx --format json
          cp bom.json "dist/${CRATE}-bom.json"

          cat dist/*.sha256 > "dist/${CRATE}-${TAG}-checksums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ""
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
