[package]
name = "tabssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["casjay"]
license = "MIT"
description = "Cross-platform SSH/SFTP client with browser-style tabs"
repository = "https://github.com/tabssh/desktop"
homepage = ""

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
russh = "0.40"
russh-keys = "0.40"
russh-sftp = "2.0"
eframe = { version = "0.25", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.25"
egui_extras = { version = "0.25", features = ["image"] }
vte = "0.13"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
shellexpand = "3.1"
rust-embed = { version = "8", features = ["compression"] }

[lib]
name = "tabssh"
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "2.1"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
strip = "symbols"

[[test]]
name = "ssh_config"
path = "tests/ssh_config_test.rs"

[[test]]
name = "connection_flow"
path = "tests/integration/connection_flow_test.rs"

[[test]]
name = "full_workflow"
path = "tests/integration/full_workflow_test.rs"

[[test]]
name = "port_forwarding"
path = "tests/integration/port_forwarding_test.rs"

[[test]]
name = "sftp_integration"
path = "tests/integration/sftp_test.rs"

[[test]]
name = "theme_integration"
path = "tests/integration/theme_integration_test.rs"

[[test]]
name = "database"
path = "tests/unit/database_test.rs"

[[test]]
name = "forwarding_unit"
path = "tests/unit/forwarding_test.rs"

[[test]]
name = "helpers"
path = "tests/unit/helpers_test.rs"

[[test]]
name = "platform"
path = "tests/unit/platform_test.rs"

[[test]]
name = "settings_unit"
path = "tests/unit/settings_test.rs"

[[test]]
name = "theme_unit"
path = "tests/unit/theme_test.rs"

[[test]]
name = "transfer"
path = "tests/unit/transfer_test.rs"

[[test]]
name = "vt_parser"
path = "tests/unit/vt_parser_test.rs"

[[bench]]
name = "performance"
harness = false
