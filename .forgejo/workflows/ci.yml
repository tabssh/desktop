name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run tests
        run: cargo test --workspace --all-features --target x86_64-unknown-linux-musl

      - name: Coverage gate (60% minimum)
        run: cargo tarpaulin --workspace --all-features --fail-under 60 --timeout 120

  build:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build release (linux/amd64)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static linkage
        run: |
          # musl's ldd on a genuinely static binary reports "Not a valid
          # dynamic program" (not glibc's "not a dynamic executable"
          # wording), so match both phrasings case-insensitively.
          ldd target/x86_64-unknown-linux-musl/release/${{ github.event.repository.name }} 2>&1 \
            | grep -qiE 'not a dynamic executable|not a valid dynamic program|statically linked'

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/${{ github.event.repository.name }} \
            dist/${{ github.event.repository.name }}-linux-x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ github.event.repository.name }}-linux-x86_64-${{ github.sha }}
          path: dist/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@a94d152bf65bebf5baa486d3d4dfee520af2ceed  # v3.88.2
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify all third-party actions are pinned to a 40-char SHA
        run: |
          set -eo pipefail
          bad=$(grep -RhnE '^\s*uses:\s*[^@]+@(v?[0-9]|main|master)' \
            .github/ .gitea/ .forgejo/ 2>/dev/null || true)
          if [[ -n "$bad" ]]; then
            echo "::error::Unpinned actions found (must be 40-char SHAs):"
            echo "$bad"
            exit 1
          fi

  vuln-scan:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check licenses advisories bans sources

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check if Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f "docker/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build local image for scanning
        if: steps.dockerfile_check.outputs.exists == 'true'
        run: docker build -f docker/Dockerfile -t scan-target:ci .

      - name: Trivy image scan
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scan-target:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
