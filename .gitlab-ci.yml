stages:
  - lint
  - test
  - build
  - security
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  IMAGE: casjaysdev/rust:latest

default:
  image: casjaysdev/rust:latest
  cache:
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

lint:
  stage: lint
  script:
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings

test:
  stage: test
  script:
    - cargo test --workspace --all-features --target x86_64-unknown-linux-musl
    - cargo tarpaulin --workspace --all-features --fail-under 60 --timeout 120

build:
  stage: build
  needs: [lint, test]
  script:
    - cargo build --release --target x86_64-unknown-linux-musl
    - CRATE=$(grep '^name' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
    - mkdir -p dist
    - cp "target/x86_64-unknown-linux-musl/release/${CRATE}" "dist/${CRATE}-linux-x86_64"
    - sha256sum "dist/${CRATE}-linux-x86_64" > "dist/${CRATE}-linux-x86_64.sha256"
    - ldd "target/x86_64-unknown-linux-musl/release/${CRATE}" 2>&1 | grep -qE 'not a dynamic executable|statically linked'
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  only:
    - main
    - develop

secret-scan:
  stage: security
  image: trufflesecurity/trufflehog:latest
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --only-verified
  allow_failure: false

workflow-policy:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache grep
  script: |
    bad=$(grep -RhnE '^\s*uses:\s*[^@]+@(v?[0-9]|main|master)' .github/ .gitea/ .forgejo/ 2>/dev/null || true)
    if [ -n "$bad" ]; then
      echo "ERROR: Unpinned actions found (must be 40-char SHAs):"
      echo "$bad"
      exit 1
    fi

vuln-scan:
  stage: security
  script:
    - cargo audit
    - cargo deny check licenses advisories bans sources

image-scan:
  stage: security
  image: aquasecurity/trivy:latest
  script: |
    if [ -f docker/Dockerfile ]; then
      docker build -f docker/Dockerfile -t scan-target:ci . || true
      trivy image --severity CRITICAL,HIGH --exit-code 1 scan-target:ci
    else
      echo "No Dockerfile found, skipping image scan"
    fi
  allow_failure: true

release:
  stage: release
  needs: [build, secret-scan, vuln-scan]
  script:
    - CRATE=$(grep '^name' Cargo.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
    - mkdir -p dist
    - |
      for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
        cargo build --release --target "$TARGET"
        case "$TARGET" in
          x86_64-unknown-linux-musl)  ARTIFACT="${CRATE}-linux-x86_64" ;;
          aarch64-unknown-linux-musl) ARTIFACT="${CRATE}-linux-aarch64" ;;
        esac
        cp "target/$TARGET/release/$CRATE" "dist/$ARTIFACT"
        sha256sum "dist/$ARTIFACT" > "dist/$ARTIFACT.sha256"
      done
    - cargo cyclonedx --format json
    - cp bom.json "dist/${CRATE}-bom.json"
    - cat dist/*.sha256 > "dist/${CRATE}-${CI_COMMIT_TAG}-checksums.txt"
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  only:
    - tags
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
