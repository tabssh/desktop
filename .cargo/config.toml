# Cross-compile targets — linker and rustflags only; profile settings belong in Cargo.toml

[target.x86_64-unknown-linux-musl]
linker = "x86_64-alpine-linux-musl-gcc"
# relocation-model=static disables PIE: musl's ldd executes PIE binaries to
# probe them, and a static-pie musl binary self-identifies as its own
# loader (ld-musl-*.so.1) because it embeds loader-compatible startup code
# for self-relocation. That self-identification is a false positive, not
# a real dynamic dependency, but it fails the CI "no dynamic deps" check.
# A fully static (non-PIE) binary reports unambiguously as
# "not a dynamic executable".
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-freebsd]
linker = "x86_64-unknown-freebsd-gcc"

[target.aarch64-unknown-freebsd]
linker = "aarch64-unknown-freebsd-gcc"
