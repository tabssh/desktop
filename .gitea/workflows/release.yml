name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Compile check (amd64)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Compile check (arm64)
        run: cargo build --release --target aarch64-unknown-linux-musl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          ref="${{ github.ref }}"
          if [[ "$ref" != refs/tags/* ]]; then
            echo "::error::release.yml triggered on non-tag ref '$ref'. Releases require a tag push (refs/tags/v...)."
            exit 1
          fi
          tag="${ref#refs/tags/}"
          if printf '%s' "$tag" | grep -qP '[[:space:][:cntrl:]]'; then
            echo "::error::Tag '$tag' contains whitespace or control characters and is not a valid tag name."
            exit 1
          fi
          echo "Tag '$tag' validated at $(git rev-parse HEAD)"

      - name: Build release artifacts
        run: |
          mkdir -p dist
          REPO="${{ github.event.repository.name }}"
          TAG="${{ github.ref_name }}"

          for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo build --release --target "$TARGET"

            case "$TARGET" in
              x86_64-unknown-linux-musl)  ARTIFACT="${REPO}-linux-x86_64" ;;
              aarch64-unknown-linux-musl) ARTIFACT="${REPO}-linux-aarch64" ;;
            esac

            cp "target/$TARGET/release/$REPO" "dist/$ARTIFACT"
            sha256sum "dist/$ARTIFACT" > "dist/$ARTIFACT.sha256"

            ldd "target/$TARGET/release/$REPO" 2>&1 \
              | grep -qE 'not a dynamic executable|statically linked' \
              || { echo "::error::$TARGET binary has unexpected dynamic deps"; exit 1; }
          done

          cargo cyclonedx --format json
          cp bom.json "dist/${REPO}-bom.json"

          cat dist/*.sha256 > "dist/${REPO}-${TAG}-checksums.txt"

      - name: Create Gitea Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
